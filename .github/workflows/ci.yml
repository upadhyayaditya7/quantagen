name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # The distribution is part of the promise: an installed wheel must be
      # self-contained (config included) and must expose the console script.
      - name: Install the package
        run: |
          python -m pip install --no-deps -e .
          quantagen --version

      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest-run.log

      # The pipeline is lossy, so token savings are only half the claim: this
      # fails the build if cleaning starts destroying numbers, entities or
      # figure references that it used to keep (see eval/retention.py).
      - name: Retention floors
        run: |
          set -o pipefail
          python eval/retention.py --check 2>&1 | tee retention-run.log

      # Retention proves content survives. This proves it is still *findable*:
      # the curated questions must retrieve their answer chunk from the cleaned
      # text at least as well as from the raw extraction (see eval/retrieval.py).
      - name: Retrieval floors
        run: |
          set -o pipefail
          python eval/retrieval.py --check 2>&1 | tee retrieval-run.log

      # The benchmark's inputs and gold are data, and data rots quietly: a
      # manifest with a stale hash or a gold quote that no longer appears on the
      # page it names would otherwise only be found by a run that happens to
      # look at that document. Both checks are offline; the corpus itself is not
      # downloaded here, so gold is validated for structure only.
      - name: Benchmark data checks
        run: |
          set -o pipefail
          python bench/fetch.py --check 2>&1 | tee bench-fetch.log

      - name: Benchmark gold checks
        run: |
          set -o pipefail
          python bench/goldlib.py --check --no-documents 2>&1 | tee bench-gold.log

      # Every parameter behind a published number is read from bench/rubric.json
      # and tests/test_rubric.py proves the code reads it; this proves the file
      # on this commit still validates on its own.
      - name: Rubric checks
        run: |
          set -o pipefail
          python -c "from bench import rubric; print('rubric OK', rubric.RUBRIC['retrieval'])" 2>&1 | tee bench-rubric.log

      # Preserve the tee'd exit status with pipefail; publish the full
      # pytest output to the (publicly readable) job summary when the run
      # fails, so the failing traceback can be diagnosed without accessing
      # admin-only raw logs.
      - name: Publish failure diagnostics
        if: failure()
        run: |
          {
            for log in pytest-run.log retention-run.log retrieval-run.log \
                       bench-fetch.log bench-gold.log bench-rubric.log; do
              [ -f "$log" ] || continue
              echo "## $log (Python ${PYTHON_VERSION:-unknown})"
              echo '```'
              tail -c 30000 "$log"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
