name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest tests -q 2>&1 | tee pytest-run.log

      # Preserve the tee'd exit status with pipefail; publish the full
      # pytest output to the (publicly readable) job summary when the run
      # fails, so the failing traceback can be diagnosed without accessing
      # admin-only raw logs.
      - name: Publish failure diagnostics
        if: failure()
        run: |
          {
            echo "## Pytest output (${PYTHON_VERSION:-unknown})"
            echo '```'
            tail -c 30000 pytest-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
