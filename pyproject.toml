[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantagen"
dynamic = ["version"]
description = "Turn PDFs into token-efficient, LLM-ready text with a loss ledger you can audit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["pdf", "llm", "rag", "text-extraction", "tokenization", "context-window"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
]
# Pinned deliberately: the retention floors and the README numbers were measured
# against these builds. See the comment in requirements.txt.
dependencies = [
    "PyMuPDF==1.27.2.3",
    "tiktoken==0.13.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
quantagen = "quantagen.cli:main"

[tool.setuptools]
packages = ["quantagen", "quantagen.rules"]

[tool.setuptools.package-data]
quantagen = ["config.json"]

[tool.setuptools.dynamic]
version = { attr = "quantagen.__version__" }
